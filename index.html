<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <div class="info-container">
            <h1>TicTacToe</h1>
            <div>
                <label for="player-x-name">Player X</label>
                <label for="player-o-name">Player O</label>
                <input type="text" id="player-x-name" name="player-x-name" placeholder="Player 1" required>
                <input type="text" id="player-o-name" name="player-o-name" placeholder="Player 2" required>
                <button  id="start-game-btn">Start New Game</button>
            </div>
        </div>
        <div class="game-container">
            <p class="turn"><span class="player-turn-name">Player 1's</span> Turn</p>
            <div class="game-board">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>
            <div class="bottom-container">
                <span class="player-x-score">Player 1(X): 0</span>
                <button class="restart">Restart</button>
                <span class="player-o-sccore">Player 2(O): 0</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
