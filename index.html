<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <div class="info-container">
            <h1>TicTacToe</h1>
            <div class="form">                
                <label for="player-x-name">Player X</label>
                <label for="player-o-name">Player O</label>
                <input type="text" id="player-x-name" name="player-x-name" placeholder="Player 1" required>
                <input type="text" id="player-o-name" name="player-o-name" placeholder="Player 2" required>
                <button  id="start-game-btn">Start New Game</button>                
            </div>
        </div>
        <div class="game-container">
            <p class="turn"><span class="player-turn-name">Player 1</span>'s Turn</p>
            <div class="result-screen hidden"><p><span></span><span class="game-result"></span></p></div>
            <div class="game-board">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>
            <div class="bottom-container">
                <p><span class="player-x-score-name">Player 1(X): </span><span class="player-x-score">0</span></p>
                <button class="restart">Restart</button>
                <p><span class="player-o-score-name">Player 2(O): </span><span class="player-o-score">0</span></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
